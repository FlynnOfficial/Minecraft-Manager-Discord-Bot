[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-discord-crafty"
version = "1.0.0"
description = "Painel Discord privado para Minecraft Vanilla via Crafty v2"
requires-python = ">=3.13,<3.14"
dependencies = [
  "discord.py>=2.6,<3", "aiohttp>=3.12,<4", "python-dotenv>=1.1,<2",
  "mcstatus>=12,<15", "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["minecraft_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
